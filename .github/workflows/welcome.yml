name: First-Time Contributor Welcome

on:
  issues:
    types: [opened]
  pull_request_target:
    types: [opened]

jobs:
  welcome:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            try {
              const isIssue = context.eventName === 'issues';
              const item = isIssue ? context.payload.issue : context.payload.pull_request;
              const author = item.user.login;
              
              // Check if this is the author's first contribution
              const query = isIssue 
                ? `is:issue author:${author} repo:${context.repo.owner}/${context.repo.repo}`
                : `is:pr author:${author} repo:${context.repo.owner}/${context.repo.repo}`;
              
              const result = await github.rest.search.issuesAndPullRequests({
                q: query,
                sort: 'created',
                order: 'asc'
              });
              
              // Only welcome if this is their first contribution
              if (result.data.total_count === 1) {
                const welcomeMessage = isIssue
                  ? `👋 Welcome @${author}! Thank you for your first question to the Collective.\n\n` +
                    `A collective member will review and respond. For safety, we may generalize or redact details before answering.\n\n` +
                    `While you wait, feel free to explore our:\n` +
                    `- [Answer Style Guide](https://github.com/${context.repo.owner}/${context.repo.repo}/blob/main/ANSWER_STYLE_GUIDE.md)\n` +
                    `- [Code of Conduct](https://github.com/${context.repo.owner}/${context.repo.repo}/blob/main/CODE_OF_CONDUCT.md)`
                  : `👋 Welcome @${author}! Thank you for your first contribution to the Collective.\n\n` +
                    `We appreciate your help making this portal better. Your PR will be reviewed soon.\n\n` +
                    `Please ensure your changes align with our:\n` +
                    `- [Contributing Guidelines](https://github.com/${context.repo.owner}/${context.repo.repo}/blob/main/CONTRIBUTING.md)\n` +
                    `- [Code of Conduct](https://github.com/${context.repo.owner}/${context.repo.repo}/blob/main/CODE_OF_CONDUCT.md)`;
                
                if (isIssue) {
                  await github.rest.issues.createComment({
                    ...context.repo,
                    issue_number: item.number,
                    body: welcomeMessage
                  });
                } else {
                  await github.rest.issues.createComment({
                    ...context.repo,
                    issue_number: item.number,
                    body: welcomeMessage
                  });
                }
              }
            } catch (error) {
              // Don't fail the workflow if welcome message fails
              console.log(`Welcome message failed: ${error.message}`);
            }
